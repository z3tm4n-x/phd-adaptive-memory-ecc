name: RE-GOES19 fetch revised public seven
on:
  push:
    branches: [research/goes19-proton-rate-01]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current public Jan14-Jan20 files
        run: |
          mkdir public7
          base='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes19/l2/data/sgps-l2-avg5m/2026/01'
          for d in 14 15 16 17 18 19 20; do
            f="sci_sgps-l2-avg5m_g19_d202601${d}_v3-0-3.nc"
            curl -fsSL "$base/$f" -o "public7/$f"
          done
          sha256sum public7/*
      - uses: actions/upload-artifact@v4
        with:
          name: re-goes19-public7
          path: public7/
          retention-days: 1
