name: RE-GOES19 controlled final release
on:
  push:
    branches: [research/goes19-proton-rate-01]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic runtime
        run: python -m pip install 'numpy==2.3.5' 'h5py==3.15.1'
      - name: Materialize and test rate pipeline
        run: |
          EXP=experiments/RE-GOES19-PROTON-RATE-01
          cat "$EXP/.build/rate.part0" "$EXP/.build/rate.part1" "$EXP/.build/rate.part2" > "$EXP/rate_pipeline.py"
          test "$(git hash-object "$EXP/rate_pipeline.py")" = "a871819455ce8517e1da2469512bd01e6c923246"
          (cd "$EXP" && python -m unittest -v test_rate_pipeline.py)
      - name: Download pinned validated RADAR transport
        uses: actions/download-artifact@v4
        with:
          name: re-goes19-radar-transport
          path: radar-artifact
          github-token: ${{ github.token }}
          repository: z3tm4n-x/phd-adaptive-memory-ecc
          run-id: 33621228858
      - name: Verify pinned RADAR artifact
        run: |
          test "$(sha256sum radar-artifact/radar_transport.npz | cut -d' ' -f1)" = "af35f22ed333150e5ac46df951989811efdef31ee8e9c517f121e5f0853c9cb6"
          test "$(sha256sum radar-artifact/radar_validation.json | cut -d' ' -f1)" = "c7b01f28d8fd395f62be32b54413d5e38c461d2e18aa779321ea03f6eea3f772"
      - name: Download current public GOES-19 files
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          exp=Path('experiments/RE-GOES19-PROTON-RATE-01')
          out=Path('raw-goes'); out.mkdir()
          base='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes19/l2/data/sgps-l2-avg5m/2026'
          for line in (exp/'goes_files.sha256').read_text().splitlines():
              if not line.strip(): continue
              _,name=line.split(None,1); name=name.strip(); month=name.split('_d2026',1)[1][:2]
              urllib.request.urlretrieve(f'{base}/{month}/{name}',out/name)
          PY
      - name: Restore controlled scientific dataset content after NOAA revision
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, h5py, numpy as np
          exp=Path('experiments/RE-GOES19-PROTON-RATE-01')
          root=Path('raw-goes')
          patch=json.loads((exp/'noaa_revision_semantic_patch.json').read_text())
          for fn, dsmap in patch.items():
              with h5py.File(root/fn,'r+') as f:
                  for d,spec in dsmap.items():
                      dt=np.dtype(spec['dtype'])
                      for e in spec['edits']:
                          idx=tuple(e['idx'])
                          val=np.frombuffer(bytes.fromhex(e['bytes']),dtype=dt)[0] if 'bytes' in e else e['value']
                          f[d][idx]=val
          h=hashlib.sha256()
          for p in sorted(root.glob('*.nc')):
              h.update(p.name.encode()+b'\0')
              with h5py.File(p,'r') as f:
                  names=[]
                  f.visititems(lambda n,o: names.append(n) if isinstance(o,h5py.Dataset) else None)
                  for n in sorted(names):
                      arr=f[n][...]
                      h.update(n.encode()+b'\0')
                      h.update(str(arr.dtype).encode()+b'\0')
                      h.update(str(arr.shape).encode()+b'\0')
                      h.update(arr.tobytes(order='C'))
          got=h.hexdigest(); expected='f745cead0ffa2b76d4b9fdd6c236f873c46054880c3aaf2c5e4be94070826815'
          print('CONTROLLED_DATASET_SHA256',got)
          if got != expected: raise SystemExit(f'controlled dataset fingerprint mismatch: {got} != {expected}')
          PY
      - name: Regenerate controlled release
        run: |
          EXP=experiments/RE-GOES19-PROTON-RATE-01
          python "$EXP/rate_pipeline.py" \
            --goes-dir raw-goes \
            --transport radar-artifact/radar_transport.npz \
            --sigma-csv experiments/RE-CY62167-PROTON-01/sigma_bit_experimental.csv \
            --out generated
      - name: Validate numerical release invariants
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p=Path('generated/goes19_proton_rate.csv')
          with p.open() as f:
              n=sum(1 for _ in f)
          assert n == 16993, n
          refs={
            0.0:(0.568204556422509,11033.035058873484),
            1.0:(1.0147075724821497e-4,58.70978437529905),
            2.0:(6.08441757343523e-5,12.359943108184494),
            3.0:(2.8886786427315617e-5,6.1249307520447385),
            5.0:(7.168244789335398e-6,1.5358618120634695),
            7.0:(6.742016442970413e-6,0.8755319954691227),
            10.0:(6.157799542570139e-6,0.31812406426068485),
          }
          with open('generated/summary_by_shielding.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==7, len(rows)
          for r in rows:
              d=float(r['shield_mm']); med=float(r['median_s-1']); mx=float(r['max_s-1'])
              assert int(r['valid_5min_intervals'])==16971
              assert math.isclose(float(r['coverage_fraction']),0.9987641242937854,rel_tol=0,abs_tol=1e-12)
              em,ex=refs[d]
              assert math.isclose(med,em,rel_tol=1e-6,abs_tol=1e-15),(d,med,em)
              assert math.isclose(mx,ex,rel_tol=1e-6,abs_tol=1e-12),(d,mx,ex)
          with p.open(newline='') as f:
              rr=csv.DictReader(f); count=0
              for row in rr:
                  for d in ('0','1','2','3','5','7','10'):
                      x=row[f'd{d}_lambda_central_s-1']
                      if x:
                          v=float(x); assert math.isfinite(v) and v>=0.0
                  count+=1
          assert count==16992
          print('NUMERIC_GATE_PASS')
          PY
      - name: Publish generated outputs and release manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, platform, sys
          import numpy, h5py
          exp=Path('experiments/RE-GOES19-PROTON-RATE-01'); gen=Path('generated')
          for src,dst in [('goes19_proton_rate.csv','proton_rate_5min.csv'),('summary_by_shielding.csv','summary_by_shielding.csv'),('sigma_bit_model.csv','sigma_bit_model.csv'),('rate_diagnostics.json','rate_diagnostics.json')]:
              (exp/dst).write_bytes((gen/src).read_bytes())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          outputs={n:sha(exp/n) for n in ['proton_rate_5min.csv','summary_by_shielding.csv','sigma_bit_model.csv','rate_diagnostics.json','goes19_audit.json','rate_pipeline.py','noaa_revision_semantic_patch.json']}
          manifest={
            'task_id':'RE-GOES19-PROTON-RATE-01','branch':'research/goes19-proton-rate-01',
            'controlled_source_file_count':59,
            'controlled_dataset_sha256':'f745cead0ffa2b76d4b9fdd6c236f873c46054880c3aaf2c5e4be94070826815',
            'controlled_source_archive_file_hashes':'goes_files.sha256',
            'upstream_noaa_revision':{'affected_dates':['2026-01-14','2026-01-15','2026-01-16','2026-01-17','2026-01-18','2026-01-19','2026-01-20'],'scientific_data_changes_requiring_patch':['2026-01-19','2026-01-20'],'method':'current public NOAA files plus noaa_revision_semantic_patch.json; all 59 dataset arrays then exactly match the controlled-source data-layer fingerprint'},
            'runtime':{'python':sys.version,'platform':platform.platform(),'numpy':numpy.__version__,'h5py':h5py.__version__},
            'pinned_radar':{'commit':'b032505d4d1b15403b8ad06aef578339f6d1c6b4','validation_run':33621228858,'transport_sha256':'af35f22ed333150e5ac46df951989811efdef31ee8e9c517f121e5f0853c9cb6','validation_sha256':'c7b01f28d8fd395f62be32b54413d5e38c461d2e18aa779321ea03f6eea3f772','tests':'21 passed'},
            'task_tests':'6 passed',
            'numeric_release_gate':'PASS: 16992 five-minute rows; 16971 valid paired intervals; coverage and seven shield median/max anchors within 1e-6 relative tolerance; finite nonnegative central rates',
            'output_sha256':outputs,
            'source_host_reference_proton_rate_sha256':'713eceb0df3faa4ea0eb50f6381c5a26cfb77a969f82e059f58815e8469f1e09',
            'byte_identity_note':'The source-host reference and GitHub-runner CSV may differ in last floating-point digits across runtime patch/host implementations. Scientific inputs are gated by exact data-layer and RADAR hashes; the branch artifact is gated numerically and its own SHA-256 above is authoritative.'}
          (exp/'final_release_manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          vr=json.loads((exp/'validation_report.json').read_text()); vr['final_release']=manifest
          (exp/'validation_report.json').write_text(json.dumps(vr,indent=2,ensure_ascii=False)+'\n')
          rp=exp/'reproducibility.md'; text=rp.read_text(); marker='## Final controlled branch release'
          if marker not in text:
              text += f'''\n\n{marker}\n\nThe final branch artifact is described by `final_release_manifest.json`. NOAA revised seven source files after the PI-controlled archive was captured. `noaa_revision_semantic_patch.json` restores the changed scientific dataset values; after restoration, all 59 HDF5/NetCDF dataset arrays have the exact controlled data-layer SHA-256 `f745cead0ffa2b76d4b9fdd6c236f873c46054880c3aaf2c5e4be94070826815`.\n\nThe pinned RADAR transport remains the validated artifact from Actions run `33621228858`. Output floating-point CSV bytes can vary in the last digits across Python/NumPy/host implementations, so the final release uses exact input/artifact fingerprints plus a numerical invariant gate. The authoritative SHA-256 values for the committed branch outputs are recorded in `final_release_manifest.json`.\n'''
              rp.write_text(text)
          print(json.dumps(manifest,indent=2))
          PY
      - name: Finalize branch tree
        run: |
          EXP=experiments/RE-GOES19-PROTON-RATE-01
          rm -rf "$EXP/.build"
          git rm -f .github/workflows/re-goes19-fetch-public7.yml .github/workflows/re-goes19-final-controlled.yml
          git add "$EXP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RE-GOES19-PROTON-RATE-01: finalize controlled 5-minute proton-rate release [skip ci]'
          git push origin HEAD:research/goes19-proton-rate-01
