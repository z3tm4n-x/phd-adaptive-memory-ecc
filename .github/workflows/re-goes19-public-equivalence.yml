name: RE-GOES19 public-vs-controlled equivalence diagnostic
on:
  push:
    branches: [research/goes19-proton-rate-01]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: z3tm4n-x/RADAR
          ref: b032505d4d1b15403b8ad06aef578339f6d1c6b4
          path: external/RADAR
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/RADAR pytest h5py
      - name: Assemble rate pipeline and test
        run: |
          EXP=experiments/RE-GOES19-PROTON-RATE-01
          cat "$EXP/.build/rate.part0" "$EXP/.build/rate.part1" "$EXP/.build/rate.part2" > "$EXP/rate_pipeline.py"
          test "$(git hash-object "$EXP/rate_pipeline.py")" = "a871819455ce8517e1da2469512bd01e6c923246"
          pytest -q external/RADAR/tests/test_proton_al_shielding.py external/RADAR/tests/test_proton_al_survival.py external/RADAR/tests/test_proton_al_secondary.py
          (cd "$EXP" && python -m unittest -v test_rate_pipeline.py)
      - name: Download current public GOES files
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          exp=Path('experiments/RE-GOES19-PROTON-RATE-01')
          out=Path('raw-goes'); out.mkdir()
          base='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes19/l2/data/sgps-l2-avg5m/2026'
          for line in (exp/'goes_files.sha256').read_text().splitlines():
              if not line.strip(): continue
              _,name=line.split(None,1); name=name.strip(); month=name.split('_d2026',1)[1][:2]
              urllib.request.urlretrieve(f'{base}/{month}/{name}',out/name)
          PY
      - name: Build pinned RADAR transport
        run: |
          python experiments/RE-GOES19-PROTON-RATE-01/radar_converged.py --radar-root external/RADAR --sigma-csv experiments/RE-CY62167-PROTON-01/sigma_bit_experimental.csv --out radar-artifact
      - name: Build release from current public files
        run: |
          python experiments/RE-GOES19-PROTON-RATE-01/rate_pipeline.py --goes-dir raw-goes --transport radar-artifact/radar_transport.npz --sigma-csv experiments/RE-CY62167-PROTON-01/sigma_bit_experimental.csv --out public-release
          echo CONTROLLED_EXPECTED_rate=713eceb0df3faa4ea0eb50f6381c5a26cfb77a969f82e059f58815e8469f1e09
          echo CONTROLLED_EXPECTED_summary=6ea8d227b12851cb5e33f47a5dfa6bd51de91ee60983714351688203b4bc0d95
          echo CONTROLLED_EXPECTED_audit=fbc53e60d28cff3a8aaf8d518cd3b4fcb45d2dafbe08a64f4d13e5ed51d06ee1
          sha256sum public-release/goes19_proton_rate.csv public-release/summary_by_shielding.csv public-release/goes19_audit.json public-release/sigma_bit_model.csv public-release/rate_diagnostics.json radar-artifact/radar_validation.json
          python - <<'PY'
          import csv
          p='public-release/summary_by_shielding.csv'
          with open(p,newline='') as f:
              rows=list(csv.DictReader(f))
          for r in rows:
              if r.get('sigma_model')=='main_loglog' and r.get('direction')=='central' and r.get('low_gamma') in ('2','2.0','2.000000'):
                  print('PUBLIC_SUMMARY',r)
          PY
