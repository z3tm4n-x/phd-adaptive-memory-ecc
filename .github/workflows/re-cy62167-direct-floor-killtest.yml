name: RE-CY62167 direct-floor kill test
on:
  push:
    branches: [research/cy62167-direct-floor-killtest-01]
permissions:
  contents: write
  actions: read
jobs:
  killtest:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==2.3.5' 'h5py==3.15.1'
      - name: Run kill-test unit tests
        run: |
          cd experiments/RE-CY62167-DIRECT-FLOOR-KILLTEST-01
          python -m unittest -v test_direct_floor_killtest.py
          python -m py_compile direct_floor_killtest.py killtest_run.py
      - name: Download pinned validated RADAR transport
        uses: actions/download-artifact@v4
        with:
          name: re-goes19-radar-transport
          path: radar-artifact
          github-token: ${{ github.token }}
          repository: z3tm4n-x/phd-adaptive-memory-ecc
          run-id: 33621228858
      - name: Verify pinned RADAR artifact
        run: |
          test "$(sha256sum radar-artifact/radar_transport.npz | cut -d' ' -f1)" = "af35f22ed333150e5ac46df951989811efdef31ee8e9c517f121e5f0853c9cb6"
          test "$(sha256sum radar-artifact/radar_validation.json | cut -d' ' -f1)" = "c7b01f28d8fd395f62be32b54413d5e38c461d2e18aa779321ea03f6eea3f772"
      - name: Download current public GOES-19 source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          exp=Path('experiments/RE-GOES19-PROTON-RATE-01'); out=Path('raw-goes'); out.mkdir()
          base='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes19/l2/data/sgps-l2-avg5m/2026'
          for line in (exp/'goes_files.sha256').read_text().splitlines():
              if not line.strip(): continue
              _,name=line.split(None,1); name=name.strip(); month=name.split('_d2026',1)[1][:2]
              urllib.request.urlretrieve(f'{base}/{month}/{name}',out/name)
          PY
      - name: Restore controlled Task-2 GOES data layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,h5py,json,numpy as np
          exp=Path('experiments/RE-GOES19-PROTON-RATE-01'); root=Path('raw-goes')
          patch=json.loads((exp/'noaa_revision_semantic_patch.json').read_text())
          for fn,dsmap in patch.items():
              with h5py.File(root/fn,'r+') as f:
                  for d,spec in dsmap.items():
                      dt=np.dtype(spec['dtype'])
                      for e in spec['edits']:
                          idx=tuple(e['idx']); val=np.frombuffer(bytes.fromhex(e['bytes']),dtype=dt)[0] if 'bytes' in e else e['value']; f[d][idx]=val
          h=hashlib.sha256()
          for p in sorted(root.glob('*.nc')):
              h.update(p.name.encode()+b'\0')
              with h5py.File(p,'r') as f:
                  names=[]; f.visititems(lambda n,o: names.append(n) if isinstance(o,h5py.Dataset) else None)
                  for n in sorted(names):
                      a=f[n][...]; h.update(n.encode()+b'\0'); h.update(str(a.dtype).encode()+b'\0'); h.update(str(a.shape).encode()+b'\0'); h.update(a.tobytes(order='C'))
          got=h.hexdigest(); expected='f745cead0ffa2b76d4b9fdd6c236f873c46054880c3aaf2c5e4be94070826815'
          print('CONTROLLED_DATASET_SHA256',got)
          if got!=expected: raise SystemExit(f'{got} != {expected}')
          PY
      - name: Run spectrum-weighted parent-event kill test
        run: |
          NEW=experiments/RE-CY62167-DIRECT-FLOOR-KILLTEST-01
          T1=experiments/RE-CY62167-PROTON-01
          T2=experiments/RE-GOES19-PROTON-RATE-01
          python "$NEW/direct_floor_killtest.py" \
            --goes-dir raw-goes \
            --transport radar-artifact/radar_transport.npz \
            --sigma-csv "$T1/sigma_bit_experimental.csv" \
            --published-csv "$T2/published_physics_sigma.csv" \
            --multiplicity-csv "$T1/multiplicity_by_energy.csv" \
            --false-mcu-csv "$T1/false_mcu_estimates.csv" \
            --task2-rate-csv "$T2/proton_rate_5min.csv" \
            --out generated-killtest
      - name: Validate bounded outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('generated-killtest'); v=json.loads((root/'validation.json').read_text())
          assert v['disposition'] in ['A','B','C']
          assert v['goes_radar_pipeline_changed'] is False
          assert v['main_bit_rate_reconstruction_max_rel'] < 2e-6
          assert v['multiplicity_invariants_pass'] and v['nonnegative_rates_pass']
          for n in ['REPORT.md','multiplicity_model.csv','weighted_parent_event_rate.csv','direct_floor_summary.csv','direct_floor_horizon_sweep.csv','validation.json']:
              assert (root/n).stat().st_size>0,n
          print('DIRECT_FLOOR_GATE_PASS',v['disposition'])
          PY
      - name: Publish outputs and input manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,platform,sys
          import numpy,h5py
          new=Path('experiments/RE-CY62167-DIRECT-FLOOR-KILLTEST-01'); gen=Path('generated-killtest')
          names=['REPORT.md','multiplicity_model.csv','weighted_parent_event_rate.csv','direct_floor_summary.csv','direct_floor_horizon_sweep.csv','validation.json']
          for n in names: (new/n).write_bytes((gen/n).read_bytes())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          t1=Path('experiments/RE-CY62167-PROTON-01'); t2=Path('experiments/RE-GOES19-PROTON-RATE-01')
          manifest={
            'task_id':'RE-CY62167-DIRECT-FLOOR-KILLTEST-01',
            'starting_commit':'3474bf5d1773fe481bfd0a3d9013c12cb06dbabd',
            'working_branch':'research/cy62167-direct-floor-killtest-01',
            'goes_radar_pipeline_changed':False,
            'controlled_goes_dataset_sha256':'f745cead0ffa2b76d4b9fdd6c236f873c46054880c3aaf2c5e4be94070826815',
            'radar':{'repository':'z3tm4n-x/RADAR','commit':'b032505d4d1b15403b8ad06aef578339f6d1c6b4','transport_sha256':'af35f22ed333150e5ac46df951989811efdef31ee8e9c517f121e5f0853c9cb6','validation_sha256':'c7b01f28d8fd395f62be32b54413d5e38c461d2e18aa779321ea03f6eea3f772'},
            'inputs':{
              'task1_multiplicity_by_energy.csv':sha(t1/'multiplicity_by_energy.csv'),
              'task1_false_mcu_estimates.csv':sha(t1/'false_mcu_estimates.csv'),
              'task1_sigma_bit_experimental.csv':sha(t1/'sigma_bit_experimental.csv'),
              'task2_published_physics_sigma.csv':sha(t2/'published_physics_sigma.csv'),
              'task2_proton_rate_5min.csv':sha(t2/'proton_rate_5min.csv'),
              'direct_floor_killtest.py':sha(new/'direct_floor_killtest.py'),
              'killtest_run.py':sha(new/'killtest_run.py')},
            'runtime':{'python':sys.version,'platform':platform.platform(),'numpy':numpy.__version__,'h5py':h5py.__version__},
            'outputs':{n:sha(new/n) for n in names}
          }
          (new/'input_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Finalize clean branch tree
        run: |
          git rm -f .github/workflows/re-cy62167-direct-floor-killtest.yml
          git add experiments/RE-CY62167-DIRECT-FLOOR-KILLTEST-01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RE-CY62167-DIRECT-FLOOR-KILLTEST-01: finalize conservative direct-floor kill test [skip ci]'
          git push origin HEAD:research/cy62167-direct-floor-killtest-01
